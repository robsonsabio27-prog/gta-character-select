<!doctype html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p class="nome">Lucia</p>
    <img class="personagem" src="img/lucia.png" alt="imagem da Lucia" />

    <div class="textos">
      <p class="etiqueta01">Escolha seu personagem</p>
      <h1 class="etiqueta02">
        Não é só <br />
        um jogo
      </h1>
      <p class="etiqueta03" aria-live="polite">
        Escolha uma lenda de Dev City. Ou tire uma selfie e vire uma.
      </p>
    </div>

    <div class="menu">
      <img
        onclick="escolherPersonagem('Lucia', 'img/lucia.png', '#ff3cac')"
        class="avatar"
        src="img/lucia.png"
        alt="avatar: lucia"
      />

      <img
        onclick="escolherPersonagem('Jason', 'img/jason.png', '#00b2c9')"
        class="avatar"
        src="img/jason.png"
        alt="avatar: jason"
      />

      <img
        onclick="escolherPersonagem('CJ', 'img/cj.png', '#7ed37e')"
        class="avatar"
        src="img/cj.png"
        alt="avatar: cj"
      />

      <label class="voce">
        <span class="iconVoce">📷</span>
        <input
        id="foto"
        class="input-foto"
        type="file"
        accept="image/*"
        capture="user"
        onchange="lerFoto(this)"
        hidden
      />
      </label>
      
    </div>
    <script src="https://js.puter.com/v2/"></script>
    <script src="script.js"></script>
  </body>
</html>
